name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` triggers the `prepare` script, which already builds dist/.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Fails if coverage drops below the 100% threshold in jest.config.mjs.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # publint + arethetypeswrong: catches a broken `exports` map or type
      # declarations that misrepresent the module format to consumers.
      - name: Validate packaging
        run: npm run check:pack

      # Fails if the ESM entry grows past the budget declared in package.json.
      - name: Check bundle size
        run: npm run size

  edge:
    name: Edge runtime
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Corre la librería dentro del sandbox de @edge-runtime, con las globales
      # de Cloudflare Workers / Vercel Edge en vez de las de Node.
      - name: Test on edge runtime
        run: npm run test:edge

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Chromium headless contra endpoints reales servidos por Vitest: usa el
      # fetch del navegador, no un adaptador simulado.
      - name: Test in browser
        run: npm run test:browser
