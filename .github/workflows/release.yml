name: Release

# Publica en npm con procedencia (provenance) cuando se empuja un tag `v*`.
#
# La procedencia es una atestación firmada que vincula el tarball publicado con
# el commit y el workflow exactos que lo produjeron. Quien instale el paquete
# puede verificar que salió de este repositorio y no de la máquina de alguien.
#
# Requisito previo, que se configura una sola vez en npm y no desde aquí: el
# paquete debe tener habilitado un *trusted publisher* apuntando a este
# repositorio y a este workflow. Sin eso, `npm publish --provenance` falla.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Necesario para que npm pueda firmar la atestación de procedencia vía OIDC.
      id-token: write


    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Se repite la verificación completa aquí a propósito: un tag puede
      # empujarse desde cualquier sitio, y publicar es irreversible.
      - name: Verify
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run test:coverage
          npm run build
          npm run check:pack
          npm run size

      # Falla si el tag no coincide con la versión de package.json, que es el
      # error más fácil de cometer al etiquetar a mano.
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "El tag ($TAG) no coincide con package.json ($PKG)" >&2
            exit 1
          fi

      # El secreto se comprueba en shell, no en una expresión: `setup-node` con
      # `registry-url` rellena NODE_AUTH_TOKEN con un placeholder cuando el
      # secreto está vacío, así que una comparación con '' nunca resulta cierta.
      - name: Check for npm credentials
        id: creds
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.creds.outputs.available == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Sin credenciales el tag sigue siendo válido y la verificación de arriba
      # sirve igual; simplemente no se publica. Evita dejar la corrida en rojo por
      # una credencial que todavía no se ha configurado.
      - name: Skip publish (no npm credentials configured)
        if: steps.creds.outputs.available != 'true'
        run: |
          echo "::notice::NPM_TOKEN no está configurado: se omite la publicación."
          echo "Para publicar: añade el secreto NPM_TOKEN y configura un trusted"
          echo "publisher en npm apuntando a este repositorio y a este workflow."
